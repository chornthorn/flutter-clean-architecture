name: kaisel_generator
description: "Blazing-fast Rust-based code generator and annotations for Kaisel module registry."
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  ffi: ^2.2.0
  # `lib/builder.dart` is the build_runner entry point; `lib/micro_mount.dart`
  # types generated declarations against kaisel's runtime types. `build` is
  # range-pinned so this package works with either major line (source_gen 4.x
  # based generators pull build 4.x).
  build: ">=2.4.2 <5.0.0"
  glob: ^2.1.3
  kaisel: ^1.1.0
