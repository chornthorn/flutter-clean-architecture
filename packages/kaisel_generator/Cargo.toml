[package]
name = "kaisel_generator"
version = "0.1.0"
edition = "2024"

[lib]
name = "kaisel_generator"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kaisel_generator"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-dart = "0.2.0"
rayon = "1.10"
walkdir = "2.5"
ignore = "0.4"
blake3 = "1.5"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = "none"
