name: flutter_x
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Pinned to local workspace for development/testing
  cqrs:
    path: /Users/thorn/Documents/Workspaces/open_source/cqrs-dart/packages/cqrs
  # A regular dependency, not a dev one: the annotations live in this package
  # and `lib/` imports them.
  cqrs_codegen:
    path: /Users/thorn/Documents/Workspaces/open_source/cqrs-dart/packages/cqrs_codegen
  get_it: ^9.2.1
  injectify: ^0.1.0
  kaisel: ^1.1.0
  provider: ^6.1.5+1
  retrofit: ^4.10.0
  dio: ^5.11.1
  # View-model state: one `AsyncSignal` per use case, exposed as a
  # `ReadonlySignal` so only the view model can push state into it.
  signals: ^7.1.0
  json_annotation: ^4.12.0
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectify_generator: ^0.1.0
  mocktail: ^1.0.5
  design_builder: ^1.0.1
  retrofit_generator: ^10.2.9
  json_serializable: ^6.14.1
  # Finders for widget tests. `patrolTest` (native automation) would need
  # `patrol_cli` and native project setup; neither is configured.
  patrol: ^4.10.0

# `cqrs_codegen` declares its sibling `cqrs` as a hosted dependency, and pub
# refuses to unify that with the git source above. The name `cqrs` on pub.dev is
# also an unrelated package, so this override is what keeps the generator and the
# runtime on the same commit.
dependency_overrides:
  # `patrol_log`, behind `patrol`, pins `equatable ^2.1.0`, but the only
  # equatable API it touches is `with Equatable`, which 3.x keeps. Drop this
  # override once Patrol allows equatable 3.
  equatable: ^3.0.0
  cqrs:
    path: /Users/thorn/Documents/Workspaces/open_source/cqrs-dart/packages/cqrs

flutter:
  uses-material-design: true
