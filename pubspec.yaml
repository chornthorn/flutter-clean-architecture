name: flutter_x
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Pinned to a commit: the repo publishes no tags, so a ref is the only
  # reproducible choice. Bump this deliberately.
  cqrs:
    git:
      url: https://github.com/chornthorn/cqrs-dart.git
      path: packages/cqrs
      ref: f497decc2e8defd90f525eb8f54e131014ebab96
  # A regular dependency, not a dev one: the annotations live in this package
  # and `lib/` imports them.
  cqrs_codegen:
    git:
      url: https://github.com/chornthorn/cqrs-dart.git
      path: packages/cqrs_codegen
      ref: f497decc2e8defd90f525eb8f54e131014ebab96
  get_it: ^9.2.1
  injectify: ^0.1.0
  kaisel: ^1.1.0
  provider: ^6.1.5+1
  retrofit: ^4.10.0
  dio: ^5.11.1
  # View-model state: one `AsyncSignal` per use case, exposed as a
  # `ReadonlySignal` so only the view model can push state into it.
  signals: ^7.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectify_generator: ^0.1.0
  mocktail: ^1.0.5
  design_builder: ^1.0.1
  retrofit_generator: ^10.2.9
  json_serializable: ^6.14.1

# `cqrs_codegen` declares its sibling `cqrs` as a hosted dependency, and pub
# refuses to unify that with the git source above. The name `cqrs` on pub.dev is
# also an unrelated package, so this override is what keeps the generator and the
# runtime on the same commit.
dependency_overrides:
  cqrs:
    git:
      url: https://github.com/chornthorn/cqrs-dart.git
      path: packages/cqrs
      ref: f497decc2e8defd90f525eb8f54e131014ebab96

flutter:
  uses-material-design: true
