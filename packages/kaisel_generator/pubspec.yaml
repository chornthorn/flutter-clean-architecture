name: kaisel_generator
description: "build_runner source generator and annotations for the Kaisel module registry."
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  # The scan is Dart's own parser and AST, so there is no compiled engine to
  # rebuild between a source change and the generated registry.
  analyzer: ^13.0.0
  # `lib/builder.dart` is the build_runner entry point; `build` is the interface
  # it implements.
  build: ^4.0.0
  glob: ^2.1.3
  kaisel: ^1.1.0
  path: ^1.9.0
  # The SPI framework the capability SPIs in `src/spi/` are built on. A package
  # that extends Kaisel depends on `spi`, never on this package's internals.
  spi:
    path: ../spi
  # `kaisel.yaml` and `pubspec.yaml` are parsed as YAML, not line-scraped.
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.25.0
