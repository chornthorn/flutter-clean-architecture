name: spi
description: "The Kaisel SPI: the interfaces a package implements to extend the generator — scanners, parsers, emitters and the generation providers themselves."
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

# Deliberately dependency-free: a package that implements an SPI depends on this
# one and nothing else — no analyzer, no build_runner, no Flutter.
dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
