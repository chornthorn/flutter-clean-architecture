include: package:flutter_lints/flutter.yaml

# Architectural rules the app enforces on itself, from `packages/flutter_x_lints`.
#
# Each rule takes a severity instead of just on/off:
#   error | warning | info   enable at that severity
#   true                     enable at the severity the rule declares
#   false | disable          turn the rule off
plugins:
  flutter_x_lints:
    path: packages/flutter_x_lints
    diagnostics:
      # Clean architecture's dependency direction: `domain` names neither outer
      # layer, and `presentation` never reaches into `infrastructure`.
      layer_dependency_direction: error
      # A widget that holds a Command or a Query has taken over a decision that
      # belongs to its view model.
      no_cqrs_in_widgets: error
      # Dispatching outside a view model loses the screen lifecycle: the
      # cancellation and the error state the route is owed.
      no_dispatcher_outside_view_model: error
      # A class that lives in `view_models/` without the base takes on a
      # screen's work without the screen's lifecycle.
      view_model_must_extend_base: error

analyzer:
  # Generated sources are not ours to lint: `design_builder` and `injectify`
  # overwrite them wholesale, and their style is the generator's business.
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**
    # Throwaway fixtures (the generator's performance monorepo), written with
    # hand-rolled package configs and never meant to be analyzed as part of the app.
    - .temp/**
